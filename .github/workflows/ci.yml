name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -v

  smoke:
    name: Fresh install and end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only what the test itself needs: a virtual display, ffmpeg to generate clips, and the
      # X11 libraries a desktop already has. The player's own requirements are left to install.sh.
      - name: Install test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb ffmpeg fonts-dejavu-core fonts-noto-core \
            libegl1 libgl1 libopengl0 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Samovar Lite as the README says
        run: ./install.sh
      - name: The samovar-lite command works
        run: ~/.local/bin/samovar-lite --version
      - name: End-to-end test on a virtual display
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python tests/smoke.py

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
